services:
  # ----------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ----------------------------------------------------
  - type: web
    name: ecocycle-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2"
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecocycle-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: FRONTEND_URL
        value: https://ecocycle.onrender.com
      - key: CORS_ORIGINS
        value: https://ecocycle.onrender.com,http://localhost:3000,http://localhost:4173
      - key: MAX_UPLOAD_SIZE
        value: "5242880"
      - key: AI_CONFIDENCE_THRESHOLD
        value: "0.60"

  # ----------------------------------------------------
  # 2. React Frontend Static Site
  # ----------------------------------------------------
  - type: web
    name: ecocycle-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: ecocycle-backend
          type: web
          property: host

databases:
  # ----------------------------------------------------
  # 3. PostgreSQL Managed Database
  # ----------------------------------------------------
  - name: ecocycle-db
    region: oregon
    plan: free
    databaseName: ecocycle_db
    user: ecocycle_user
