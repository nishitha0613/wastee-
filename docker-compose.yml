version: '3.8'

services:
  # ----------------------------------------------------
  # 1. PostgreSQL Database Service (Production Backend)
  # ----------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: ecocycle_db
    restart: always
    environment:
      POSTGRES_USER: ecocycle_user
      POSTGRES_PASSWORD: ecocycle_secure_password
      POSTGRES_DB: ecocycle_production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecocycle_user -d ecocycle_production"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # 2. FastAPI Backend API Service
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecocycle_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ecocycle_user:ecocycle_secure_password@db:5432/ecocycle_production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace_with_a_secure_random_jwt_secret_in_production}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:4173,http://127.0.0.1:3000,http://127.0.0.1:4173}
      MAX_UPLOAD_SIZE: 5242880
      AI_CONFIDENCE_THRESHOLD: 0.60
      ADMIN_NAME: "System Administrator"
      ADMIN_EMAIL: "admin@ecocycle.com"
      ADMIN_PASSWORD: "Admin@Secure123!"
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  backend_uploads:
